<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f6f3ee"/>
<title>Block — your training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f3ee;--surface:#fff;--surface2:#fbf9f5;--ink:#2b2823;--muted:#8c8478;--faint:#b3ab9d;--line:#ece5da;
    --pine:#2f5d4e;--pine-soft:#e4efe9;--pine-ink:#214339;--clay:#bf6f3a;--clay-soft:#f7e9da;--gold:#b89234;--brick:#b1524a;
    --shadow:0 1px 2px rgba(58,48,34,.04),0 6px 18px rgba(58,48,34,.06);--shadow-lg:0 2px 6px rgba(58,48,34,.06),0 14px 34px rgba(58,48,34,.10);--r:18px;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{padding-bottom:94px}
  .serif{font-family:"Fraunces",Georgia,serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;color:var(--ink);font-size:16px}
  ::placeholder{color:var(--faint)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,rgba(246,243,238,0));padding:22px 0 8px}
  .hello{font-family:"Fraunces";font-weight:500;font-size:26px;letter-spacing:-.01em;line-height:1.1}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;font-weight:500}.sub b{color:var(--pine)}
  .banner{display:flex;align-items:center;gap:12px;background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:var(--r);padding:13px 15px;margin:13px 0 4px}
  .banner .txt{flex:1;font-size:13.5px;color:var(--pine-ink);font-weight:500;line-height:1.35}
  .banner button{background:var(--pine);color:#fff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px;white-space:nowrap}

  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
  .weeknav .wt{font-family:"Fraunces";font-weight:500;font-size:18px}
  .weeknav button{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:17px;box-shadow:var(--shadow)}
  .weekstrip{display:flex;gap:5px;margin-bottom:16px}
  .daycell{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:8px 1px;text-align:center;box-shadow:var(--shadow)}
  .daycell.sel{background:var(--pine);border-color:var(--pine)}
  .daycell .dw{font-size:10px;font-weight:700;color:var(--faint)}
  .daycell.sel .dw{color:#a9cdc0}
  .daycell .dn{font-family:"Fraunces";font-weight:600;font-size:16px;margin:2px 0}
  .daycell.sel .dn{color:#fff}
  .daycell.today .dn{color:var(--clay)}
  .daycell.sel.today .dn{color:#fff;text-decoration:underline}
  .daycell .dc{font-size:9px;font-weight:700;color:var(--muted);min-height:11px}
  .daycell.sel .dc{color:#cfe4dc}

  .sesshead{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 10px;gap:10px}
  .sesshead .st{font-family:"Fraunces";font-weight:500;font-size:21px;line-height:1.1}
  .sesshead .sx{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
  .swapbtn{background:var(--pine-soft);color:var(--pine);font-weight:700;border-radius:10px;padding:9px 13px;font-size:13px;white-space:nowrap}
  .swaprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
  .swapopt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
  .swapopt.on{background:var(--pine);color:#fff;border-color:var(--pine)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .ex-head{display:flex;align-items:center;gap:14px;padding:17px 18px}
  .ex-head .meta{flex:1;min-width:0}
  .ex-name{font-family:"Fraunces";font-weight:500;font-size:19px;line-height:1.12}
  .ex-sub{font-size:12px;color:var(--muted);margin-top:5px;font-weight:500}
  .target{text-align:right;line-height:1}
  .target .kg{font-family:"Fraunces";font-weight:600;font-size:30px}
  .target .unit{font-size:11px;color:var(--muted);font-weight:600}
  .target .reps{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
  .target .last{font-size:10.5px;color:var(--faint);margin-top:4px;font-weight:600}
  .tag{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:8px}
  .tag.up{color:var(--clay);background:var(--clay-soft)}.tag.hold{color:var(--gold);background:#f6efd9}
  .tag.rep{color:var(--muted);background:var(--surface2)}.tag.coach{color:var(--pine);background:var(--pine-soft)}
  .ex-open{border-top:1px solid var(--line);padding:16px 18px;background:var(--surface2)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  .setrow{display:grid;grid-template-columns:30px 1fr 1fr;gap:9px;align-items:center;margin-bottom:9px}
  .setrow .n{font-size:12px;font-weight:700;color:var(--faint)}
  .setrow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-soft)}
  .rpe-note{display:grid;grid-template-columns:88px 1fr;gap:9px;margin-top:3px}
  .rpe-note input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
  .save-row{display:flex;gap:9px;margin-top:13px}
  .btn{background:var(--pine);color:#fff;font-weight:700;border-radius:13px;padding:14px;font-size:15px;width:100%;box-shadow:var(--shadow)}
  .btn:active{transform:translateY(1px)}.btn:disabled{opacity:.55}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
  .btn.sm{padding:10px 15px;width:auto;font-size:13.5px;border-radius:11px}
  .btn.link{background:none;box-shadow:none;color:var(--muted);font-weight:600;width:auto;padding:8px;text-decoration:underline}
  .hist{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .hist .h{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--faint);margin-bottom:8px}
  .hist .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0;font-weight:500}
  .hist .row b{color:var(--ink);font-weight:600}
  .finisher{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin:6px 0 12px;box-shadow:var(--shadow)}
  .finisher .t{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--clay);text-transform:uppercase}
  .finisher .b{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.5;font-weight:500}
  .finisher.warmup .t{color:var(--pine)}
  .food-note{font-size:13px;color:var(--muted);margin:16px 4px 6px;line-height:1.55;font-weight:500}
  h2.sec{font-family:"Fraunces";font-weight:500;font-size:20px;margin:24px 2px 13px;letter-spacing:-.01em}

  .moverow{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .moverow:last-child{border-bottom:none}
  .moverow .mk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto}
  .moverow.done .mk{background:var(--pine);border-color:var(--pine)}
  .moverow .mn{flex:1;font-weight:600;font-size:14.5px}
  .moverow .md{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .moverow .demo{display:inline-block;margin-left:10px;font-size:10.5px;font-weight:700;color:var(--pine);background:var(--pine-soft);border-radius:7px;padding:3px 8px;white-space:nowrap}
  .simple{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:12px}
  .simple .si{font-family:"Fraunces";font-size:19px;font-weight:500;margin-bottom:8px}
  .simple .sb{font-size:14px;color:var(--muted);font-weight:500;line-height:1.5}
  .donepill{display:inline-flex;align-items:center;gap:7px;background:var(--pine-soft);color:var(--pine-ink);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;margin-top:14px}

  .goalcard{background:var(--pine);color:#fff;border-radius:var(--r);padding:18px 19px;box-shadow:var(--shadow-lg);margin-bottom:18px}
  .goalcard .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#a9cdc0;text-transform:uppercase}
  .goalcard .v{font-family:"Fraunces";font-weight:500;font-size:18px;line-height:1.35;margin-top:9px}
  .goalcard .wk{margin-top:13px;font-size:12px;color:#bcd9cf;font-weight:500}
  .coach-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .coach-box textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:96px;resize:vertical;line-height:1.5}
  .coach-msg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:12px;padding:16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;box-shadow:var(--shadow);margin-top:16px}
  .coach-msg .who{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pine);text-transform:uppercase;margin-bottom:8px}
  .think{color:var(--muted);font-size:14px;padding:16px;text-align:center}
  .prop{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:11px;box-shadow:var(--shadow)}
  .prop .change{font-family:"Fraunces";font-weight:500;font-size:16px;line-height:1.3}
  .prop .why{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;font-weight:500}
  .prop .acts{display:flex;gap:9px;margin-top:13px}
  .prop .kindtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);background:var(--clay-soft);padding:3px 8px;border-radius:7px;margin-bottom:9px}
  .prop.goal .kindtag,.prop.food .kindtag{color:var(--pine);background:var(--pine-soft)}
  .applied-note{background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:13px;padding:13px 15px;margin-top:14px;font-size:13px;color:var(--pine-ink);font-weight:600}
  .applied-list{background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:13px;padding:13px 15px;margin-top:14px}
  .applied-list .al-h{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--pine);text-transform:uppercase;margin-bottom:9px}
  .applied-list .al-row{font-size:13.5px;color:var(--pine-ink);font-weight:600;line-height:1.45;padding:5px 0;border-top:1px solid #d4e6dd}
  .applied-list .al-row:first-of-type{border-top:none}

  .howto{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
  .exfig{width:96px;height:96px;flex:0 0 auto}
  .exfig line{stroke:var(--pine);stroke-width:5;stroke-linecap:round}
  .exfig .hd{fill:var(--pine)}
  .exfig .bar{stroke:var(--clay);stroke-width:5;stroke-linecap:round}
  .exfig .floor{stroke:#e4ddcf;stroke-width:2.5;stroke-linecap:round}
  .howto-side{flex:1;min-width:0}
  .howto-cue{font-size:13px;color:var(--muted);line-height:1.45;font-weight:500}
  .whyline{font-size:12.5px;color:var(--pine-ink);background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:11px;padding:9px 12px;margin:0 0 13px;line-height:1.4;font-weight:500}
  .rungbar{display:flex;align-items:center;gap:9px;background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:12px;padding:8px 9px;margin:0 0 12px}
  .rungbtn{flex:0 0 auto;font-size:12px;font-weight:700;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  .rungbtn:disabled{opacity:.35;cursor:default}
  .rungbtn.hi{background:var(--pine-ink);color:#fff;border-color:var(--pine-ink)}
  .rungmid{flex:1;text-align:center;min-width:0}
  .rungnow{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3}
  .rungready{font-size:11px;font-weight:700;color:var(--pine-ink)}
  .runghold{font-size:11px;font-weight:700;color:#b0653a}
  .timerbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 12px}
  .timerdisp{flex:1;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .alsodid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .alsolbl{font-size:12px;color:var(--muted);font-weight:600}
  .alsobtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  .alsobtn:disabled{opacity:.55;cursor:default;color:var(--pine-ink)}
  .fedbtn{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;margin-right:6px}
  .ftag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--pine-ink);background:var(--pine-soft);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .frow.fedit{flex-direction:column;align-items:stretch;gap:0}
  .demo-link{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;color:var(--pine);background:var(--pine-soft);border-radius:9px;padding:7px 12px;text-decoration:none}
  .swaprow2{margin-top:12px}
  .swapbtn2{font-size:12px;font-weight:700;color:var(--clay);background:var(--clay-soft);border-radius:9px;padding:8px 12px}
  .swapform{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .swaphint{flex:1 1 100%;font-size:11.5px;color:var(--clay);font-weight:600;line-height:1.4}
  .swapform .swapname{flex:1 1 100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
  .swapform .swapnum{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .totals{display:flex;gap:12px;margin-bottom:16px}
  .tcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
  .tcard .tl{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase}
  .tcard .tv{font-family:"Fraunces";font-weight:600;font-size:26px;margin-top:6px;line-height:1}
  .tcard .tv small{font-family:"Hanken Grotesk";font-size:13px;color:var(--muted);font-weight:600}
  .bar{height:7px;border-radius:6px;background:var(--surface2);margin-top:11px;overflow:hidden;border:1px solid var(--line)}
  .bar .fill{height:100%;border-radius:6px;background:var(--pine)}.bar .fill.over{background:var(--clay)}.bar .fill.prot{background:var(--gold)}
  .sugg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .schip{display:inline-flex;align-items:center;gap:8px;background:var(--pine-soft);border:1px solid #d4e6dd;border-radius:999px;padding:8px 8px 8px 13px;font-size:13px;font-weight:600;color:var(--pine-ink)}
  .schip button{background:var(--pine);color:#fff;width:22px;height:22px;border-radius:50%;font-weight:700;line-height:1}
  .foodlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .frow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}.frow .fn{flex:1}.frow .fn .nm{font-weight:600;font-size:14.5px}
  .frow .fn .mi{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:500}
  .frow .add{background:var(--pine-soft);color:var(--pine);font-weight:700;border-radius:9px;padding:8px 13px;font-size:13px}
  .qbox{display:flex;align-items:center;gap:8px}
  .qbox button{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:16px;line-height:1}
  .qbox input{width:54px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px}
  .logitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .logitem:last-child{border-bottom:none}.logitem .li-n{flex:1;font-weight:600}
  .logitem .li-m{color:var(--muted);font-size:12.5px;font-weight:600}.logitem .rm{color:var(--brick);font-size:18px;padding:0 4px}
  .searchbar{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:11px;box-shadow:var(--shadow)}

  .weekhdr{font-family:"Fraunces";font-weight:500;font-size:16px;margin:20px 2px 11px;display:flex;justify-content:space-between;align-items:baseline}
  .weekhdr small{font-family:"Hanken Grotesk";font-size:12px;color:var(--muted);font-weight:600}
  .session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow)}
  .session .sd{font-size:12px;font-weight:700;color:var(--pine);margin-bottom:10px}
  .session .sl{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:4px 0;color:var(--muted);font-weight:500}
  .session .sl .nm2{flex:1}.session .sl b{color:var(--ink);font-weight:600}
  .session .sl .del{color:var(--brick);font-size:15px;padding:0 4px;margin-left:8px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 20px;line-height:1.6;font-weight:500}

  .edit-ex{display:grid;grid-template-columns:1fr 46px 64px 40px;gap:7px;margin-bottom:9px;align-items:center}
  .edit-ex input,.edit-ex select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;box-shadow:var(--shadow)}
  .edit-ex .x{color:var(--brick);text-align:center;font-size:18px;box-shadow:none}
  .blockcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .blockcard h3{font-family:"Fraunces";font-weight:500;font-size:17px;margin:0 0 13px}
  .prof{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .prof label{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;display:block;margin-bottom:6px}
  .prof input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px}
  .snap-h{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--clay);text-transform:uppercase;margin:0 0 8px}
  .snap-row{display:grid;grid-template-columns:1fr auto 16px auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
  .snap-row:last-child{border-bottom:none}
  .sl-lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
  .sl-then{font-size:13px;color:var(--faint);font-weight:600}
  .sl-arrow{font-size:12px;color:var(--faint);text-align:center}
  .sl-now{font-size:15px;color:var(--pine);font-weight:600}
  .snap-foot{font-size:12px;color:var(--muted);font-weight:500;margin-top:6px}
  .goalbox textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:80px;resize:vertical;line-height:1.5;box-shadow:var(--shadow)}

  .lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:330px;margin:0 auto;padding:24px}
  .lock .mark{font-family:"Fraunces";font-weight:600;font-size:40px;letter-spacing:-.02em;color:var(--pine)}
  .lock p{color:var(--muted);margin:2px 0 6px;font-size:14px;font-weight:500}

    const rpe=Number(last&&last.rpe)||0;
    const rangeFail=/round|arch|hunch|bent back|back bend|knees? bent|bent knee|too wide|lost.*flat|can'?t.*flat|couldn'?t.*flat/.test(note);
    const cleanNote=/eas|smooth|clean|flat|control|solid|strong|comfortable/.test(note);
    const inc=ex.inc||10;
    const base=Math.max(ex.lo,lastSecs.length?Math.max(...lastSecs):(Number(last&&last.targetSecs)||ex.hi));
    const hitAll=lastSecs.length>=ex.sets&&lastSecs.every(s=>s>=base);
    const b={ladder,rungIdx,rungName:rung.name,onLoadRung:false,rangeFail};
    if(!last) return {...b,secs:ex.hi,secsArr:Array.from({length:ex.sets},()=>ex.hi),kind:"new",hint:"ease in · flat back",why:`Start at this width: hold up to ${ex.hi}s with a flat back at your honest depth. When it's easy and clean, tap ▲ to widen.`,readyToAdvance:false};
    let secsTop=base,kind="rep",hint="beat your time · flat back",why=`Hold ${base}s with a flat back, walking the hands a little further. Build time and depth here, then widen.`,readyToAdvance=false;
    if(rangeFail){secsTop=Math.max(ex.lo,base);kind="down";hint="flat back first — hold";why="You flagged rounding or too-wide → stay at this width and own the flat-back hold before widening. Depth never comes from rounding.";}
    else if(hitAll&&base>=ex.hi&&((rpe>0&&rpe<=6)||cleanNote)){kind="up";hint="ready to widen ▲";secsTop=base;readyToAdvance=rungIdx<ladder.length-1;why=readyToAdvance?`Clean, flat-back holds at ${base}s and low RPE — widen when you're ready (tap ▲). No rush: a flat-back fold matters more than width.`:`Full width, held clean — keep building depth and time.`;}
    else if(hitAll){secsTop=base+inc;kind="up";hint=`+${inc}s`;why=`Held ${base}s on every set → +${inc}s at this width. Keep the back flat; note how it felt and I'll flag the next width once it's easy.`;}
    return {...b,secs:secsTop,secsArr:Array.from({length:ex.sets},()=>secsTop),kind,hint,why,last,readyToAdvance};
  }
  const oVal=override?firstNum(override.value??override.weight):null;
  if(override&&oVal!=null&&(!last||new Date(override.date)>new Date(last.date)))
    return {secs:oVal,secsArr:Array.from({length:ex.sets},()=>oVal),kind:"coach",hint:"coach set",why:"Your coach set this target — adjust in the coach tab if it feels off.",last};
  if(!last)
    return {secs:ex.hi,secsArr:Array.from({length:ex.sets},()=>ex.hi),kind:"new",hint:`aim ${ex.hi}s`,why:`First time — work up to ${ex.hi}s per set in a good position.`,last:null};
  const lastSecs=(last.secs||[]).map(Number);
  // No upper cap: your best hold sets the base, even beyond the listed range.
  const base=Math.max(ex.lo,lastSecs.length?Math.max(...lastSecs):(Number(last.targetSecs)||ex.hi));
  const note=(last.note||"").toLowerCase();
  const easy=/eas|light|comfort|smooth|flew|strong/.test(note),failed=/fail|couldn'?t|could ?not|had to stop|gave up|collaps|dropped/.test(note);
  const hitAll=lastSecs.length>=ex.sets&&lastSecs.every(s=>s>=base);
  const rpe=Number(last.rpe)||0;
  const inc=ex.inc||0;
  let secsTop=base,kind="hold",hint="hold — stay controlled",why=`Maintenance hold — keep ${base}s clean and controlled.`;
  if(inc>0){
    if(hitAll&&rpe<9&&!failed){secsTop=base+inc;kind="up";hint=`+${inc}s — you earned it`;why=`You held ${base}s on every set${rpe?` at RPE ${rpe}`:""} → +${inc}s this time.`;}
    else if(rpe>=9||failed){secsTop=Math.max(ex.lo,base-inc);kind="down";hint="ease back this time";why=`${rpe>=9?`RPE ${rpe}`:"You flagged it hard"} last time → shorter holds to keep your position clean.`;}
    else{secsTop=base;kind="rep";hint="beat your time";why=`Hold ${base}s on all ${ex.sets} sets and the target climbs next time.`;}
  }
  return {secs:secsTop,secsArr:Array.from({length:ex.sets},()=>secsTop),kind,hint,why,last};
}

const PW_KEY="blk_pw";
const getPw=()=>{try{return localStorage.getItem(PW_KEY)||""}catch{return""}};
const setPw=(v)=>{try{localStorage.setItem(PW_KEY,v)}catch{}};
async function api(path,opts={}){
  const res=await fetch("/api/"+path,{...opts,headers:{"content-type":"application/json","x-app-password":getPw(),...(opts.headers||{})}});
  if(res.status===401){const e=new Error("401");e.code=401;throw e;}
  return res.json();
}
// Guard against a coach reply that arrives as raw JSON text
function normalizeCoach(r){
  if(r.error) return {error:r.error};
  let message=r.message||""; let proposals=Array.isArray(r.proposals)?r.proposals:[]; let clarify=r.clarify||"";
  if((!proposals.length&&!clarify)&&typeof message==="string"&&message.trim().startsWith("{")){
    try{const p=JSON.parse(message.trim());if(p&&typeof p.message==="string"){message=p.message;proposals=Array.isArray(p.proposals)?p.proposals:[];clarify=p.clarify||"";}}
    catch{return {error:"Couldn't read the coach's reply — tap again."};}
  }
  return {message,proposals,clarify};
}

/* workout proposal apply */
function applyProposal(prev,p){
  const batchKey=prev.pending?.date||"manual";
  let undoStack=prev.undoStack; const top=undoStack[undoStack.length-1];
  if(!top||top.batchKey!==batchKey) undoStack=[...undoStack,{batchKey,at:todayISO(),workouts:deep(prev.workouts),schedule:{...prev.schedule},goals:prev.goals,overrides:{...prev.overrides}}].slice(-5);
  let workouts=deep(prev.workouts),schedule={...prev.schedule},goals=prev.goals,overrides={...prev.overrides};
  const W=(id)=>workouts.find(w=>w.id===id);
  try{
    if(p.kind==="edit_exercise"){const w=W(p.workoutId);const e=w&&(w.exercises||[]).find(x=>x.id===p.exerciseId);if(e){const f=p.field;const nv=firstNum(p.value);if(["sets","lo","hi"].includes(f)){if(nv!=null)e[f]=Math.round(nv);}else if(f==="inc"){if(nv!=null)e.inc=nv;}else if(f==="name"||f==="type"){if(p.value)e[f]=p.value;}}}
    else if(p.kind==="add_exercise"){const w=W(p.workoutId);if(w&&w.exercises)w.exercises.push({id:uid(),name:p.exerciseName||p.name||"New exercise",type:p.type||"free",sets:p.sets||3,lo:p.lo||8,hi:p.hi||12,inc:p.inc!=null?p.inc:2,cue:p.cue||""});}
    else if(p.kind==="replace_exercise"){const w=W(p.workoutId);if(w&&w.exercises){const idx=w.exercises.findIndex(x=>x.id===p.exerciseId);if(idx>=0){const old=w.exercises[idx];w.exercises[idx]={id:uid(),name:p.exerciseName||p.name||old.name,type:p.type||old.type,sets:p.sets||old.sets,lo:p.lo!=null?p.lo:old.lo,hi:p.hi!=null?p.hi:old.hi,inc:p.inc!=null?p.inc:old.inc,cue:p.cue||old.cue||""};delete overrides[old.id];}}}
    else if(p.kind==="remove_exercise"){const w=W(p.workoutId);if(w&&w.exercises)w.exercises=w.exercises.filter(x=>x.id!==p.exerciseId);}
    else if(p.kind==="set_schedule"){if(p.day)schedule[p.day]=p.value;}
    else if(p.kind==="set_target"){const v=firstNum(p.value);if(p.exerciseId&&v!=null)overrides[p.exerciseId]={value:v,date:todayISO()};}
    else if(p.kind==="edit_goal"){if(p.newGoalText)goals=p.newGoalText;}
  }catch(e){}
  const remaining=(prev.pending?.proposals||[]).filter(x=>x.id!==p.id);
  return {...prev,workouts,schedule,goals,overrides,undoStack,pending:remaining.length?{...prev.pending,proposals:remaining}:null};
}
function applyFoodProposal(prev,p){
  const tomorrow=localKey(addDays(new Date(),1));
  const batchKey=prev.foodPending?.date||"manual";
  let foodUndo=prev.foodUndo; const top=foodUndo[foodUndo.length-1];
  if(!top||top.batchKey!==batchKey) foodUndo=[...foodUndo,{batchKey,at:todayISO(),foodTargets:deep(prev.foodTargets),foodSuggestions:deep(prev.foodSuggestions)}].slice(-5);
  let foodTargets={...prev.foodTargets},foodSuggestions=deep(prev.foodSuggestions);
  try{
    if(p.kind==="suggest_food"){foodSuggestions[tomorrow]=[...(foodSuggestions[tomorrow]||[]),{name:p.name||"Food",kcal:Number(p.kcal)||0,protein:Number(p.protein)||0}];}
    else if(p.kind==="target_tweak"){const base=prev.foodTargets[tomorrow]||{kcal:prev.profile.kcalTarget,protein:prev.profile.proteinTarget};foodTargets[tomorrow]={...base,[p.field==="protein"?"protein":"kcal"]:Number(p.value)};}
  }catch(e){}
  const remaining=(prev.foodPending?.proposals||[]).filter(x=>x.id!==p.id);
  return {...prev,foodTargets,foodSuggestions,foodUndo,foodPending:remaining.length?{...prev.foodPending,proposals:remaining}:null};
}

// How-to library — shown in the exercise card so you can train without the video.
// Keyed by exercise name; a stored ex.desc (e.g. set by the coach) always wins over this.
const DESCRIPTIONS={
  "Back Squat":"Bar on your upper back, brace your core, then sit down between your hips until your thighs pass parallel and drive up through mid-foot. The 3-second pause at the bottom kills the bounce and builds strength right where you're tight. Chest proud, knees tracking over your toes.",
  "Romanian Deadlift":"Soft knees, bar close to your legs. Push your hips straight back and let the bar slide down your thighs until you feel a strong hamstring stretch (usually just below the knee), keeping your back flat throughout. Stop when your hamstrings run out of range — not when the bar hits the floor — then squeeze your glutes to stand tall. Your main hamstring builder.",
  "Nordic Curl":"Kneel with your ankles anchored, body in a straight line from knees to head. Lower toward the floor as slowly as you possibly can, resisting with your hamstrings, then push back up (hands can assist). If you can't control the full range yet, just do the slow lower and push off the floor to reset. Needs your feet anchored — if you can't anchor them, swap it (see below).",
  "Jefferson Curl":"The opposite of a deadlift — here you WANT to round. Stand on a box with a light weight and slowly peel down one vertebra at a time, chin to chest, letting the spine curl fully; go only as far as you control, then reverse and stack back up bone by bone. Start very light (empty bar or a single plate). This trains a strong, mobile lower back and directly eases your back tightness.",
  "Walking Lunge":"Step forward into a lunge until both knees are ~90° with the front shin vertical, then push through the front heel to bring the back leg through into the next step, staying tall. As you sink, feel the stretch through the front of the trailing hip — that hip-flexor opening is half the point for your splits.",
  "Overhead Press":"Bar on your front shoulders, brace abs and glutes, then press straight overhead — nudging your head slightly back so the bar clears your chin — and finish with the bar stacked over mid-foot. Don't lean back; squeeze your glutes to stop the lower back arching. Lower under control to the collarbone.",
  "Pull-Ups":"Hang from the bar with shoulders lightly engaged, then pull your chest toward the bar by driving your elbows down and back until your chin clears it. Lower all the way to a full hang every rep. Once you can do 10 clean reps, start adding load rather than just more reps.",
  "DB Bench Press":"Lie back with a dumbbell in each hand at chest level, elbows about 45° from your body. Press up and slightly together until your arms are straight, then lower under control until you feel a stretch across the chest. Keep your shoulder blades pulled back and down into the bench the whole set.",
  "Face Pulls":"Set a rope or band at head height. Pull it toward your face, splitting your hands so they finish beside your ears with elbows high, and squeeze the rear shoulders for a beat. Light weight, high reps, slow tempo — this is posture and shoulder prehab, not a strength lift.",
  "Back Bridge Hold":"Lie on your back, hands by your ears (fingers toward your shoulders), feet flat and close to your hips. Push through hands and feet to lift your hips and drive your chest toward your hands, working toward straight arms. If your arms stay bent, that's your level for now — hold the tallest position you can and it opens over time. Push the floor away and breathe.",
  "Hollow Body Hold":"Lie on your back, press your lower back flat into the floor, then lift your shoulders and legs off the ground into a shallow banana shape. The whole game is keeping your lower back glued down — if it lifts, bend your knees or bring your arms by your sides to make it easier.",
  "L-Sit":"Hands on the floor or two blocks, push down hard to lift your body, then raise your legs toward a horizontal L. Start tucked (knees to chest), then one leg straight, then both, keeping your shoulders pushed down away from your ears. Even a few seconds counts — build the hold.",
  "Handstand Wall Hold":"Chest-to-wall is best: face the wall, walk your feet up until your body is stacked and vertical, ribs tucked, legs squeezed together, and hold while breathing. Come down by walking back down the wall. Build the time gradually — this is your shoulder and balance base for later skills.",
  "Pistol Squat":"Single-leg squat. Hold something for balance or sit back to a box, other leg extended in front; lower under control keeping the heel down, then drive back up. Progress: box → light counterweight held out front → free. Builds single-leg strength AND the deep ankle/hip mobility your squats need.",
  "Pseudo Planche Push-Up":"Your base-builder — do this first. Hands by your lower ribs, lean your shoulders forward past your hands and push the floor away (protract your shoulder blades). This builds the straight-arm, shoulders-forward pressing strength that makes pike push-ups possible. Start from your knees if a full plank version is too much.",
  "Pike Push-Up":"Start with your hands ELEVATED on a bench or box — the floor version is brutally hard and that's why it stalls. Hips stacked over shoulders in a pike shape, lower the crown of your head toward the floor between your hands, then press back up. As it gets easy, lower the elevation: box → step → floor → feet-elevated → handstand push-up.",
  "Dragon Flag":"Lie on a bench and grip behind your head. Keep your body rigid as a plank, lift it up onto your shoulders, then lower it slowly staying dead straight and resisting the whole way. Start tucked, then straddle, then full. Only lower as slowly as you can control — that's where the strength is built.",
  "Hip-Flexor Lunge Hold":"Half-kneeling: one foot forward, other knee down. Square your hips forward and tuck your tailbone under — you'll feel a strong stretch at the front of the down-leg's hip. Sink gently forward and hold, breathing, without letting your lower back arch (the tuck is what makes it work). Opens the hip flexors that limit your front splits.",
  "PNF Hamstring":"Lie down, one leg up (strap or hands behind the thigh), and pull it toward you until you feel a firm hamstring stretch. Hold ~30s, then push your leg AGAINST your hands for ~10s without moving, relax, and pull deeper into the new range; repeat. The contract-relax trick unlocks range faster than static stretching.",
  "Pancake Straddle Lean":"Sit with legs wide and straight, toes up. Hinge from the hips with a FLAT back — chest toward the floor, not head to knees — walking your hands a little further forward each round. Keep the back flat even if you don't go far; depth comes from the hip hinge, not rounding. (Needs straight-leg width — if a legs-together forward fold is still hard, that pike fold should come first.)",
  "Half Splits Hold":"From half-kneeling, straighten your front leg and hinge your hips back over it — flat back, toes pulled up — for a strong stretch down the front-leg hamstring. Keep the back flat and breathe into it. This is the front-split hamstring side; pair it with the hip-flexor hold for the back-leg side.",
  "Front Splits (ease in)":"Front leg forward, back leg extended behind, hands on blocks or books for support. Slide the legs apart only as far as you can while breathing calmly — never force or bounce — keeping your hips square to the front. Ease out the moment it turns sharp. Progress is measured in centimetres over weeks.",
  "Middle Splits (ease in)":"Legs wide to the sides, feet forward or slightly turned out, hands on blocks in front. Let your hips sink toward the floor under control, back tall and legs straight, supporting weight on your hands. Never force the slide — back off at any sharp pinch. Slow, patient loading is how the middle split opens.",
  "Cossack Squat Flow":"Wide stance. Shift your weight over one bent leg into a deep side lunge — heel down — keeping the other leg straight with toes up, then flow smoothly across to the other side. Stay controlled and sink as deep as your hips allow. Builds hip mobility and single-leg strength at once.",
  "90/90 Hip Switches":"Sit with both knees bent at 90° — one leg in front, one to the side. Keeping your chest tall, drive from your hips to rotate both knees across to the mirror-image position, controlling the switch rather than flopping. Mobilises internal and external hip rotation, which frees up your squat and splits.",
  "Deep Squat Hold":"Sink into the bottom of a squat, heels flat, and live there. Chest tall, use your elbows to gently pry your knees out and open the hips, and breathe. If your heels lift, hold something in front as a counterweight or put a small wedge under your heels.",
  "Thoracic Rotation Flow":"On all fours (or side-lying), reach one arm up and rotate open through your upper back, following your hand with your eyes, then return. Move from the mid-spine, not the lower back — keep your hips still. Restores the upper-back rotation that desk posture steals, and it feeds your bridge.",
  "Active Leg Raises":"Lie on your back and lift one straight leg as high as you can using only your own muscles — no hands — then lower under control. The point is ACTIVE range: strength at the top of your flexibility, which is what makes splits usable rather than just passive. Keep the other leg down and the movement smooth.",
  "Hip-Flexor Flow":"A flowing version of the hip-flexor stretch — sink into a low lunge and gently sway side to side rather than holding dead still, keeping the tailbone tucked. Flow for the full time. An easy finisher that loosens the hips without forcing a static hold.",
  "Seated Pike Fold":"Legs straight and pressed together on the floor, toes up. Hinge from the HIPS with a flat back — think chest to thighs, not nose to knees — and hold where you feel a strong (not sharp) hamstring stretch. This is the prerequisite for the pancake: you build the straight-leg forward fold with legs together first, then widen. Don't let the lower back round to fake more depth.",
  "Frog Stretch":"On all fours, knees wide with ankles in line with your knees and shins parallel, feet flexed. Keep a flat back and rock your hips slowly back toward your heels until you feel the stretch deep in the inner thighs/groin, then rock forward slightly to release. Small, controlled rocks — never force the end range. Opens the hips for the middle split.",
  "Cossack Hold":"Wide stance, shift your weight over one bent leg and sink into a deep side-lunge — heel down, chest tall — with the other leg straight and toes up. Hold at the bottom rather than flowing. Builds strength and mobility at the deep end of your hip range, which feeds the middle split.",
  "Couch Stretch":"Kneel with your rear foot propped up a wall (or couch), front foot planted in a lunge. Tuck your tailbone under and squeeze the rear glute to drive a deep stretch through the front of the back-leg hip and quad. Keep the lower back neutral — don't arch to chase depth. One of the strongest openers for the back leg of your front split.",
};
// Progression ladders — start at a rung you can actually train, walk up to the real thing.
// Each rung: {name, load, howto}. load:false = advance by LESS assistance (never +kg).
// load:true  = the one rung where added weight = harder. Current rung stored in ex.rung.
const LADDERS={
  "Pistol Squat":[
    {name:"Box squat, high seat", load:false, howto:"Stand on one leg in front of a chair or box set HIGH, other leg extended forward. Sit back and down under control until you lightly tap the seat, then drive up through the heel — no rocking, no pushing off the seat. Heel flat, knee tracking over the foot. Every rep smooth and full-range; if you're crashing down or wobbling, raise the seat."},
    {name:"Box squat, lower seat", load:false, howto:"Same as the high box, but drop the seat a notch. Still tap-and-stand with control, heel down, no rocking. Keep lowering the seat over the coming weeks as each height gets easy — that's how you advance here: less box, never more weight."},
    {name:"Counterweight pistol, full depth", load:false, howto:"No box now. Hold a light plate or dumbbell at arm's length straight out in front — it shifts your weight forward and stops you toppling backward. Lower all the way into a full one-leg squat, heel flat, then stand. The weight is HELPING you. Advance by using LESS counterweight over time, not more."},
    {name:"Free pistol", load:false, howto:"Full one-leg squat, no counterweight, arms free. Lower under control to the bottom (hip below knee), heel flat, no wobble, then stand without rocking or momentum. This is the bodyweight goal — own it for clean reps on every set before you add any load."},
    {name:"Weighted pistol", load:true, howto:"Hold a dumbbell or kettlebell at your chest and perform a full pistol. NOW the weight is load, not assistance — this is the single rung where adding kg makes it harder. Add small amounts as you get stronger, keeping full depth and control."}
  ],
  "Pancake Straddle Lean":[
    {name:"Narrow straddle", load:false, howto:"Legs straight, knees locked, toes up, opened to a NARROW straddle (about your current ~60cm knee-to-knee). Sit tall, then hinge from the hips with a flat back and hold at the point where your back is about to round — no further. Over the weeks, walk your hands a little further forward at this width while keeping the back flat. Depth comes from the hip hinge, never from rounding. Widen only when this feels easy and clean."},
    {name:"Wide straddle", load:false, howto:"Same flat-back hinge, but open the legs wider — aim ~90cm knee-to-knee. It'll feel shallower at first; that's expected. Hold at your honest flat-back depth and build from there. Never force the width to the point your back rounds or your knees bend."},
    {name:"Full pancake", load:false, howto:"Legs opened toward a straight line, as wide as they'll go with knees locked and toes up. Hinge forward with a flat back, chest leading toward the floor. This is the goal — keep it honest: flat back over depth, every single rep."}
  ]
};
const _SEGS=[["sp",1,2],["nk",1,0],["aA1",1,3],["aA2",3,4],["aB1",1,5],["aB2",5,6],["lA1",2,7],["lA2",7,8],["lB1",2,9],["lB2",9,10]];

function ExAnim({name,type}){
  const ref=useRef(null);
  const spec=animSpec(name,type);
  useEffect(()=>{
    const svg=ref.current;if(!svg)return;let raf;
    function frame(now){
      const per=spec.dur*1000,ph=(now%per)/per,tri=ph<.5?ph*2:(1-ph)*2,t=tri<.5?2*tri*tri:1-Math.pow(-2*tri+2,2)/2;
      const p=spec.A.map((v,k)=>v+(spec.B[k]-v)*t);
      _SEGS.forEach(function(seg){const e=svg.querySelector("."+seg[0]);if(e){e.setAttribute("x1",p[seg[1]*2]);e.setAttribute("y1",p[seg[1]*2+1]);e.setAttribute("x2",p[seg[2]*2]);e.setAttribute("y2",p[seg[2]*2+1]);}});
      const hd=svg.querySelector(".hd");if(hd){hd.setAttribute("cx",p[0]);hd.setAttribute("cy",p[1]);}
      if(spec.bar){const bb=svg.querySelector(".bar");if(bb){bb.setAttribute("x1",p[2]-20);bb.setAttribute("y1",p[3]-4);bb.setAttribute("x2",p[2]+20);bb.setAttribute("y2",p[3]-4);}}
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);return function(){cancelAnimationFrame(raf);};
  },[name,type]);
  return (<svg ref={ref} className="exfig" viewBox="0 0 150 150" aria-hidden="true">
    <line className="floor" x1="14" y1="133" x2="136" y2="133"/>
    {spec.bar?<line className="bar"/>:null}
    <line className="sp"/><line className="nk"/><line className="aA1"/><line className="aA2"/><line className="aB1"/><line className="aB2"/><line className="lA1"/><line className="lA2"/><line className="lB1"/><line className="lB2"/>
    <circle className="hd" r="8"/>
  </svg>);
}
function Toast({msg}){return <div className={"toast"+(msg?" show":"")}>{msg}</div>;}

function ExerciseCard({ex,history,override,logDate,onLog,workoutId,onSwap,onRung}){
  const isHold=ex.type==="hold";
  const flowEx=ex.type==="bw"&&(ex.inc||0)===0;
  const perSetW=ex.type==="free"||ex.type==="machine";
  const [open,setOpen]=useState(false);
  const t=isHold?nextHoldTarget(ex,history,override):nextTarget(ex,history,override);
  const ladder=t.ladder||LADDERS[ex.name];
  const rungIdx=ladder?(t.rungIdx!=null?t.rungIdx:Math.max(0,Math.min(ladder.length-1,ex.rung||0))):0;
  const rung=ladder?ladder[rungIdx]:null;
  const onLoadRung=!!(rung&&rung.load);
  const flowLike=flowEx||(ladder&&!onLoadRung);
  const [weight,setWeight]=useState(t.weight!=null?t.weight:"");
  const [weights,setWeights]=useState(()=>Array.from({length:ex.sets},(_,i)=>(t.weights&&t.weights[i]!=null)?String(t.weights[i]):""));
  const [reps,setReps]=useState(()=>Array.from({length:ex.sets},()=>""));
  const [secs,setSecs]=useState(()=>Array.from({length:ex.sets},(_,i)=>isHold?String((t.secsArr&&t.secsArr[i]!=null)?t.secsArr[i]:t.secs):""));
  const [rpe,setRpe]=useState("");const [note,setNote]=useState("");
  const [swapMode,setSwapMode]=useState(false);const [swapName,setSwapName]=useState("");const [swapSets,setSwapSets]=useState("");const [swapReps,setSwapReps]=useState("");
  const [tRun,setTRun]=useState(false);const [tLeft,setTLeft]=useState(null);
  useEffect(()=>{const tt=isHold?nextHoldTarget(ex,history,override):nextTarget(ex,history,override);
    if(isHold)setSecs(Array.from({length:ex.sets},(_,i)=>String((tt.secsArr&&tt.secsArr[i]!=null)?tt.secsArr[i]:tt.secs)));
    else{setWeight(tt.weight!=null?tt.weight:"");setWeights(Array.from({length:ex.sets},(_,i)=>(tt.weights&&tt.weights[i]!=null)?String(tt.weights[i]):""));}
  },[history,override]);
  const unit=ex.type==="bw"?"added kg":"kg";
  const perSide=/per side|\/side|\/leg/i.test(ex.name+" "+(ex.cue||""));
  function save(){
    if(isHold){const arr=secs.map(s=>Number(s)||0);if(arr.every(s=>s===0))return;
      onLog(ex.id,{date:logDate,secs:arr,targetSecs:Number(t.secs)||ex.hi,rpe:Number(rpe)||null,note:note.trim(),name:ex.name,type:"hold"});}
    else{const r=reps.map(s=>Number(s)||0);if(r.every(x=>x===0))return;
      if(perSetW){const ws=weights.map(x=>Number(x)||0);onLog(ex.id,{date:logDate,weight:ws[0]||0,weights:ws,reps:r,rpe:Number(rpe)||null,note:note.trim(),name:ex.name,type:ex.type,bw:false});}
      else onLog(ex.id,{date:logDate,weight:Number(weight)||0,reps:r,rpe:Number(rpe)||null,note:note.trim(),name:ex.name,type:ex.type,bw:ex.type==="bw"});}
    setReps(Array.from({length:ex.sets},()=>""));setSecs(Array.from({length:ex.sets},()=>isHold?String(t.secs):""));setRpe("");setNote("");setOpen(false);}
  let lastTxt=null;
  if(t.last){if(isHold&&t.last.secs)lastTxt=`last ${t.last.secs.join("/")}s · ${fmtDay(localKey(new Date(t.last.date))).replace(/^\w+ /,"")}`;
    else if(t.last.reps){const wp=(t.lastW&&t.lastW.some(w=>w>0))?t.lastW.join("/")+"kg · ":"";lastTxt=`last ${wp}${t.last.reps.join("/")} · ${fmtDay(localKey(new Date(t.last.date))).replace(/^\w+ /,"")}`;}}
  useEffect(()=>{
    if(!tRun||tLeft==null)return;
    if(tLeft<=0){setTRun(false);if(typeof navigator!=="undefined"&&navigator.vibrate)navigator.vibrate([200,90,200]);return;}
    const id=setTimeout(()=>setTLeft(s=>s-1),1000);
    return()=>clearTimeout(id);
  },[tRun,tLeft]);
  const bigVal=isHold?t.secs:(flowLike?t.repGoal:(t.weight!=null?t.weight:"—"));
  const bigUnit=isHold?"s":(flowLike?"reps":(t.weight!=null?unit:""));
  return (
    <div className="card">
      <div className="ex-head" onClick={()=>setOpen(o=>!o)}>
        <div className="meta"><div className="ex-name">{ex.name}</div><div className="ex-sub">{ex.sets} sets · {isHold?"timed hold":(ex.type==="bw"?"bodyweight":ex.type)}{ladder?` · Rung ${rungIdx+1}/${ladder.length}: ${rung.name}`:(ex.cue?` · ${ex.cue}`:"")}</div></div>
        <div className="target">
          <div><span className="kg serif">{bigVal}</span> <span className="unit">{bigUnit}</span></div>
          <div className="reps">{isHold||flowLike?`× ${ex.sets}${perSide?" /side":""}`:`${t.reps} reps${perSide?" /side":""}`}</div>
          <div className={"tag "+t.kind}>{t.hint}</div>
          {lastTxt&&<div className="last">{lastTxt}</div>}
        </div>
      </div>
      {open&&(<div className="ex-open">
        <div className="howto">
          <ExAnim name={ex.name} type={ex.type}/>
          <div className="howto-side">
            <div className="howto-cue">{ladder?rung.howto:(ex.desc||DESCRIPTIONS[ex.name]||ex.cue||"Controlled tempo, full range of motion.")}</div>
            <a className="demo-link" href={demoUrl(ex.name)} target="_blank" rel="noopener noreferrer">Watch demo →</a>
          </div>
        </div>
        {ladder&&(<div className="rungbar">
          <button className="rungbtn" disabled={rungIdx===0} onClick={()=>onRung&&workoutId&&onRung(workoutId,ex.id,-1)}>▼ easier</button>
          <div className="rungmid"><div className="rungnow">Rung {rungIdx+1} / {ladder.length}</div>{t.readyToAdvance?<div className="rungready">✓ earned the next rung</div>:(t.rangeFail?<div className="runghold">hold — full range first</div>:null)}</div>
          <button className="rungbtn hi" disabled={rungIdx===ladder.length-1} onClick={()=>onRung&&workoutId&&onRung(workoutId,ex.id,1)}>harder ▲</button>
        </div>)}
        {t.why&&<div className="whyline">{t.why}</div>}
        {isHold&&(<div className="timerbar">
          <div className="timerdisp">{tLeft==null?`${t.secs}s`:(tLeft<=0?"done ✓":`${tLeft}s`)}</div>
          <button className="rungbtn hi" onClick={()=>{if(tRun){setTRun(false);}else{setTLeft(v=>(v==null||v<=0)?t.secs:v);setTRun(true);}}}>{tRun?"Pause":(tLeft!=null&&tLeft>0?"Resume":"Start")}</button>
          {tLeft!=null&&<button className="rungbtn" onClick={()=>{setTRun(false);setTLeft(null);}}>Reset</button>}
        </div>)}
        <p className="lbl">{isHold?"Log this — seconds per set":"Log this session — reps per set"}</p>
        {Array.from({length:ex.sets}).map((_,i)=>(<div className="setrow" key={i}><span className="n">S{i+1}</span>
          {isHold?(<><input inputMode="numeric" placeholder="secs" value={secs[i]} onChange={e=>{const c=[...secs];c[i]=e.target.value;setSecs(c);}}/><span style={{color:"var(--faint)",fontSize:12,fontWeight:600,textAlign:"center"}}>sec</span></>)
            :perSetW?(<><input inputMode="numeric" placeholder={t.repGoal?String(t.repGoal):"reps"} value={reps[i]} onChange={e=>{const c=[...reps];c[i]=e.target.value;setReps(c);}}/><input inputMode="decimal" placeholder={unit} value={weights[i]} onChange={e=>{const c=[...weights];c[i]=e.target.value;setWeights(c);}}/></>)
            :(<><input inputMode="numeric" placeholder={t.repGoal?String(t.repGoal):"reps"} value={reps[i]} onChange={e=>{const c=[...reps];c[i]=e.target.value;setReps(c);}}/>{(ladder&&!onLoadRung)?null:(i===0?<input inputMode="decimal" placeholder={unit} value={weight} onChange={e=>setWeight(e.target.value)}/>:<span style={{color:"var(--faint)",fontSize:13,textAlign:"center",fontWeight:600}}>{weight||"—"} {unit}</span>)}</>)}
        </div>))}
        {perSetW&&<div style={{fontSize:11,color:"var(--faint)",fontWeight:600,margin:"0 0 8px"}}>Edit any set's weight for drop sets — progression follows your top (first) set.</div>}
        <div className="rpe-note"><input inputMode="numeric" placeholder="RPE" value={rpe} onChange={e=>setRpe(e.target.value)}/><input placeholder={isHold?"note (felt strong, tight hips…)":"note (felt easy, L shoulder…)"} value={note} onChange={e=>setNote(e.target.value)}/></div>
        <div className="save-row"><button className="btn sm" onClick={save}>Save set</button><button className="btn sm ghost" onClick={()=>setOpen(false)}>Close</button></div>
        <div className="swaprow2">{!swapMode?<button className="swapbtn2" onClick={()=>setSwapMode(true)}>Swap / I did something else</button>:(<div className="swapform"><div className="swaphint">Just for today — logs what you did and tells your coach. Tomorrow's plan stays.</div><input className="swapname" placeholder="What did you do? (e.g. Explosive push-ups)" value={swapName} onChange={e=>setSwapName(e.target.value)}/><input className="swapnum" inputMode="numeric" placeholder="sets" value={swapSets} onChange={e=>setSwapSets(e.target.value)}/><input className="swapnum" inputMode="numeric" placeholder="reps" value={swapReps} onChange={e=>setSwapReps(e.target.value)}/><button className="btn sm" onClick={()=>{const v=swapName.trim();if(v&&onSwap)onSwap(ex,v,swapSets,swapReps);setSwapMode(false);setSwapName("");setSwapSets("");setSwapReps("");}}>Log it</button></div>)}</div>
        {history&&history.length>0&&(<div className="hist"><div className="h">LAST {Math.min(3,history.length)} SESSIONS</div>
          {history.slice(-3).reverse().map((h,i)=>(<div className="row" key={i}><span>{fmtDay(localKey(new Date(h.date))).replace(/^\w+ /,"")}</span><span>{h.secs?<b>{h.secs.join("/")}s</b>:<><b>{h.bw?(h.weight?`+${h.weight}kg`:"BW"):(h.weights?h.weights.join("/")+"kg":(h.weight||0)+"kg")}</b> · {(h.reps||[]).join("/")}</>}{h.rpe?` · @${h.rpe}`:""}</span></div>))}</div>)}
      </div>)}
    </div>);
}

function TrainView({state,setState,save,flash}){
  const todayKey=localKey();
  const [weekStart,setWeekStart]=useState(weekStartKey(todayKey));
  const todayIdx=(new Date().getDay()+6)%7;
  const [selIdx,setSelIdx]=useState(weekStart===weekStartKey(todayKey)?todayIdx:0);
  const [swapOpen,setSwapOpen]=useState(false);

  const plan=state.weekPlans[weekStart]||state.schedule;
  const dayName=DOW[selIdx];
  const dayDate=addDays(parseKey(weekStart),selIdx);
  const dayKey=localKey(dayDate);
  const logDate=dayKey+"T12:00:00";
  const sessionVal=plan[dayName]||"off";

  function shiftWeek(n){const nw=localKey(addDays(parseKey(weekStart),n*7));setWeekStart(nw);setSwapOpen(false);}
  function swap(val){
    const base={...(state.weekPlans[weekStart]||state.schedule)};const old=base[dayName];

/* ---- shared metrics/snapshot helpers ---- */
function latestEntry(arr){return (arr&&arr.length)?arr[arr.length-1]:null;}
function firstReal(arr){return (arr||[]).find(e=>!e.marker)||null;}
function topVal(e){if(!e||e.marker)return null;if(e.secs&&e.secs.length)return Math.max(...e.secs)+"s";if(e.weights&&e.weights.length)return e.weights[0]+"kg";if(e.bw)return e.weight?"+"+e.weight+"kg":"BW";if(e.weight!=null)return e.weight+"kg";return null;}
function trainingDays(state,days){const cut=Date.now()-days*86400000;const set=new Set();Object.values(state.logs).forEach(arr=>(arr||[]).forEach(e=>{if(new Date(e.date)>=cut)set.add(localKey(new Date(e.date)));}));return set.size;}
function keyLiftRows(state){const rows=[];state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(e.inc===0)return;const arr=state.logs[e.id];if(!arr||!arr.length)return;const to=topVal(latestEntry(arr));if(!to)return;rows.push({name:e.name,from:topVal(firstReal(arr)),to});}));return rows.slice(0,8);}
function flexRows(state){const b=(state.baseline&&state.baseline.flex)||firstReal(state.flexLog);const n=latestEntry(state.flexLog);if(!n)return[];const defs=[["pike","Pike reach","cm",""],["splits","Splits gap","cm",""],["bridge","Bridge","","L"],["pancake","Pancake","","L"]];const out=[];defs.forEach(([k,lbl,suf,pre])=>{if(n[k]==null)return;out.push({label:lbl,from:(b&&b[k]!=null)?pre+b[k]+suf:"—",to:pre+n[k]+suf});});return out;}
function bodyRows(state){const b=(state.baseline&&state.baseline.body)||firstReal(state.bodyLog);const n=latestEntry(state.bodyLog);if(!n)return[];const defs=[["weight","Weight","kg"],["bodyFat","Body fat","%"],["smm","Muscle (SMM)","kg"],["visceral","Visceral fat",""]];const out=[];defs.forEach(([k,lbl,suf])=>{if(n[k]==null)return;out.push({label:lbl,from:(b&&b[k]!=null)?b[k]+suf:"—",to:n[k]+suf});});return out;}
function buildCheckinSnippet(state){
  const weekN=Math.floor(daysBetween(state.startDate)/7)+1;const L=[];
  L.push("📊 Block check-in — Week "+weekN);
  L.push("Goal: "+state.profile.weight+"kg → "+state.profile.goalWeight+"kg, stay lean + get flexible");
  const fr=flexRows(state);if(fr.length){L.push("");L.push("FLEXIBILITY (start → now)");fr.forEach(r=>L.push("• "+r.label+": "+r.from+" → "+r.to));}
  const br=bodyRows(state);if(br.length){L.push("");L.push("BODY (start → now)");br.forEach(r=>L.push("• "+r.label+": "+r.from+" → "+r.to));}
  const lr=keyLiftRows(state);if(lr.length){L.push("");L.push("KEY LIFTS (first → latest top set)");lr.forEach(r=>L.push("• "+r.name+": "+(r.from||"—")+" → "+(r.to||"—")));}
  L.push("");L.push("TRAINING");L.push("• "+trainingDays(state,14)+" sessions logged in the last 14 days");
  return L.join("\n");
}

function ProgressView({state,setState,save,flash}){

function dayTargets(state,key){return state.foodTargets[key]||{kcal:state.profile.kcalTarget,protein:state.profile.proteinTarget};}

function estBMR(state){const b=latestEntry(state.bodyLog);const w=(b&&b.weight!=null)?b.weight:(state.profile.weight||75);const lbm=(b&&b.bodyFat!=null)?w*(1-b.bodyFat/100):w*0.85;return Math.round(370+21.6*lbm);}
function dayWorkoutKcal(state,key){let has=false,fb=false,run=false,mob=true;Object.values(state.logs).forEach(arr=>(arr||[]).forEach(e=>{if(localKey(new Date(e.date))===key){const nm=(e.name||"").toLowerCase();if(/football/.test(nm))fb=true;else if(/run/.test(nm))run=true;else{has=true;if(!e.secs)mob=false;}}}));if(fb)return 500;if(run)return 300;if(!has)return 0;return mob?110:260;}
function dayBurn(state,key){const bmr=estBMR(state);const lb=latestEntry(state.bodyLog);const w=(lb&&lb.weight)||state.profile.weight||75;const steps=Number((state.steps||{})[key])||0;const stepK=Math.round(steps*w*0.0005);const wk=dayWorkoutKcal(state,key);return {bmr,base:Math.round(bmr*1.1),stepK,wk,total:Math.round(bmr*1.1+stepK+wk)};}
function recentFoodDays(state,n){return Object.keys(state.foodLog||{}).filter(k=>(state.foodLog[k]||[]).length).sort((a,b)=>b.localeCompare(a)).slice(0,n).map(k=>{const it=state.foodLog[k];const kc=it.reduce((s,i)=>s+(i.kcal||0),0),pr=it.reduce((s,i)=>s+(i.protein||0),0);const b=dayBurn(state,k);return {key:k,kc,pr,burn:b.total,net:b.total-kc};});}

    {recDays.length>0&&(<><h2 className="sec">This week</h2>

        {recDays.map(d=>(<div key={d.key} onClick={()=>setToday(d.key)} style={{display:"flex",justifyContent:"space-between",fontSize:13.5,padding:"6px 0",borderTop:"1px solid var(--line)",cursor:"pointer",background:d.key===today?"var(--surface2)":"transparent"}}><span style={{flex:1,fontWeight:600}}>{fmtDay(d.key)}</span><span style={{width:62,textAlign:"right",color:"var(--muted)",fontWeight:600}}>{d.kc}</span><span style={{width:54,textAlign:"right",color:"var(--muted)",fontWeight:600}}>{d.pr}g</span><span style={{width:64,textAlign:"right",fontWeight:700,color:d.net>=0?"var(--pine)":"var(--clay)"}}>{d.net>=0?d.net:"+"+(-d.net)}</span></div>))}

      </div>)}
