}

function kindLabel(k){return ({edit_exercise:"Adjust",add_exercise:"Add",remove_exercise:"Remove",set_schedule:"Schedule",set_target:"Set target",edit_goal:"Goal",replace_exercise:"Swap"})[k]||"Change";}
function CheckinView({state,setState,save,flash}){
  const [msg,setMsg]=useState("");const [busy,setBusy]=useState(false);const [err,setErr]=useState("");
  const [reply,setReply]=useState("");
  const [fx,setFx]=useState({pike:"",splits:"",bridge:"",pancake:""});
  const [bd,setBd]=useState({weight:"",bodyFat:"",smm:"",visceral:""});
  const pending=state.pending;const canUndo=state.undoStack.length>0;
  const thisWeek=state.weekPlans[weekStartKey(localKey())]||state.schedule;
  const lastFlex=latestEntry(state.flexLog),lastBody=latestEntry(state.bodyLog);

  function saveMetrics(){
    const flex={pike:numOrNull(fx.pike),splits:numOrNull(fx.splits),bridge:numOrNull(fx.bridge),pancake:numOrNull(fx.pancake)};
    const body={weight:numOrNull(bd.weight),bodyFat:numOrNull(bd.bodyFat),smm:numOrNull(bd.smm),visceral:numOrNull(bd.visceral)};
    const hasFlex=Object.values(flex).some(v=>v!=null),hasBody=Object.values(body).some(v=>v!=null);
    if(!hasFlex&&!hasBody){flash("Enter at least one number");return;}
    setState(prev=>{let n={...prev};const baseline={...(prev.baseline||{})};
      if(hasFlex){n.flexLog=[...prev.flexLog,{date:todayISO(),...flex}];if(!baseline.flex)baseline.flex={...flex};}
      if(hasBody){n.bodyLog=[...prev.bodyLog,{date:todayISO(),...body}];if(!baseline.body)baseline.body={...body};
        if(body.weight!=null)n.profile={...prev.profile,weight:body.weight};}
      n.baseline=baseline;save(n);return n;});
    setFx({pike:"",splits:"",bridge:"",pancake:""});setBd({weight:"",bodyFat:"",smm:"",visceral:""});flash("Metrics saved");
  }
  function copySnippet(){copyText(buildCheckinSnippet(state)).then(ok=>flash(ok?"Copied — paste into Claude":"Couldn't copy — long-press to select"));}

  async function runCoach(note){
    if(!note.trim()||busy)return;setBusy(true);setErr("");
    const slim={};Object.entries(state.logs).forEach(([k,v])=>{slim[k]=v.slice(-3);});
    const context=JSON.stringify({profile:state.profile,goals:state.goals,
      plan:state.workouts.map(w=>({workoutId:w.id,name:w.name,exercises:(w.exercises||[]).map(e=>({exerciseId:e.id,name:e.name,type:e.type,unit:e.type==="hold"?"seconds":"reps + kg",sets:e.sets,lo:e.lo,hi:e.hi,inc:e.inc}))})),
      flexibilityNow:lastFlex,flexibilityBaseline:state.baseline?state.baseline.flex:null,bodyNow:lastBody,
      thisWeekSchedule:thisWeek,defaultSchedule:state.schedule,recentSessions:slim,manualSwaps:(state.manualSwaps||[]).slice(-8)});
    try{const raw=await api("coach",{method:"POST",body:JSON.stringify({message:note,context})});const r=normalizeCoach(raw);
      if(r.error){setErr(r.error);setBusy(false);return;}
      if(r.clarify){setState(prev=>{const n={...prev,pending:{date:todayISO(),clarify:r.clarify,note,message:r.message||"",proposals:[]}};save(n);return n;});setMsg("");setBusy(false);return;}
      const proposals=(r.proposals||[]).map((p,i)=>({...p,id:"p"+Date.now()+i}));
      setState(prev=>{const n={...prev,pending:{date:todayISO(),message:r.message||"",proposals},checkins:[...prev.checkins,{date:todayISO(),note,message:r.message||""}].slice(-12),lastCheckin:todayISO()};save(n);return n;});
      setMsg("");
    }catch(e){setErr(e.code===401?"Wrong code — reload.":"Couldn't reach the coach.");}
    setBusy(false);
  }
  function sendReply(){const orig=state.pending?.note||"";const combined=orig+"\n\n(Answer to your question: "+reply.trim()+")";setReply("");setState(prev=>({...prev,pending:null}));runCoach(combined);}
  const undo=()=>setState(prev=>{const st=[...prev.undoStack];const snap=st.pop();if(!snap)return prev;const n={...prev,workouts:snap.workouts,schedule:snap.schedule,goals:snap.goals,overrides:snap.overrides,undoStack:st};save(n);flash("Reverted");return n;});
  const dismiss=()=>setState(prev=>{const n={...prev,pending:null};save(n);return n;});
  const applyOne=(p)=>setState(prev=>{const n=applyProposal(prev,p);save(n);flash("Applied");return n;});
  const skipOne=(p)=>setState(prev=>{const rem=(prev.pending&&prev.pending.proposals||[]).filter(x=>x.id!==p.id);const n={...prev,pending:rem.length?{...prev.pending,proposals:rem}:null};save(n);return n;});
  const applyAll=()=>setState(prev=>{let n=prev;((prev.pending&&prev.pending.proposals)||[]).slice().forEach(p=>{n=applyProposal(n,p);});save(n);flash("Applied");return n;});
  const weekN=Math.floor(daysBetween(state.startDate)/7)+1;
  const awaiting=pending&&pending.clarify;
  const F=(k,ph,st,set)=>(<div><label>{ph}</label><input inputMode="decimal" placeholder={st[k]===""?"—":""} value={st[k]} onChange={e=>set({...st,[k]:e.target.value})}/></div>);
  return (<div>
    <div className="goalcard"><div className="k">Current focus</div><div className="v serif">{state.goals}</div><div className="wk">Week {weekN} · {state.profile.weight}kg → {state.profile.goalWeight}kg · last check-in {state.lastCheckin?`${daysBetween(state.lastCheckin)}d ago`:"—"}</div></div>

    <h2 className="sec">Log your numbers</h2>
    <div className="blockcard">
      <div className="snap-h">Flexibility</div>
      <div className="prof">
        {F("pike","Pike reach (cm)",fx,setFx)}{F("splits","Splits gap (cm)",fx,setFx)}
        {F("bridge","Bridge (1–3)",fx,setFx)}{F("pancake","Pancake (1–3)",fx,setFx)}
      </div>
      <div className="snap-h" style={{marginTop:15}}>InBody / scale</div>
      <div className="prof">
        {F("weight","Weight (kg)",bd,setBd)}{F("bodyFat","Body fat (%)",bd,setBd)}
        {F("smm","Muscle SMM (kg)",bd,setBd)}{F("visceral","Visceral fat (1–20)",bd,setBd)}
      </div>
      <div className="save-row" style={{marginTop:14}}><button className="btn sm" onClick={saveMetrics}>Save check-in metrics</button><button className="btn sm ghost" onClick={copySnippet}>Copy for Claude</button></div>
      <div style={{fontSize:11.5,color:"var(--faint)",fontWeight:500,marginTop:10,lineHeight:1.5}}>Leave any blank — only what you fill in gets saved. Pike reach: how far past (or short of) your toes. Bridge/pancake: 1 = working on it, 3 = full.</div>
    </div>

    <h2 className="sec">Talk to your coach</h2>
    <div className="coach-box">
      <p className="lbl">How did it go?</p>
      <textarea placeholder="How did training feel? Energy, soreness, niggles, tight spots, what you want more or less of, any change in goals… The coach reads your numbers above too." value={msg} onChange={e=>setMsg(e.target.value)} disabled={!!awaiting}/>
      <div style={{marginTop:11}}><button className="btn" onClick={()=>runCoach(msg)} disabled={busy||!!awaiting}>{busy?"Coach is working…":"Send check-in"}</button></div>
      {err&&<div className="err" style={{marginTop:10}}>{err}</div>}
      {busy&&<div className="think">Reading your week and thinking it through…</div>}

      {!busy&&awaiting&&(<div>
        <div className="coach-msg"><div className="who">Your coach — quick question</div>{pending.clarify}</div>
        <textarea style={{marginTop:10}} placeholder="Your answer…" value={reply} onChange={e=>setReply(e.target.value)}/>
        <div style={{marginTop:10,display:"flex",gap:10}}><button className="btn sm" onClick={sendReply} disabled={!reply.trim()}>Send answer</button><button className="btn sm ghost" onClick={()=>{setReply("");dismiss();}}>Cancel</button></div>
      </div>)}

      {!busy&&!awaiting&&pending&&(<div>
        <div className="coach-msg"><div className="who">Your coach</div>{pending.message}</div>
        {(pending.proposals&&pending.proposals.length>0)?(<div>
          <div className="al-h" style={{margin:"14px 2px 2px"}}>Suggested changes — your call</div>
          {pending.proposals.map(p=>(<div className="prop" key={p.id}><span className="kindtag">{kindLabel(p.kind)}</span><div className="change serif">{p.summary}</div>{p.rationale&&<div className="why">{p.rationale}</div>}<div className="acts"><button className="btn sm" onClick={()=>applyOne(p)}>Apply</button><button className="btn sm ghost" onClick={()=>skipOne(p)}>Skip</button></div></div>))}
          <div style={{marginTop:12,display:"flex",gap:10,justifyContent:"center"}}><button className="btn sm" onClick={applyAll}>Apply all</button><button className="btn link" onClick={dismiss}>Dismiss</button></div>
        </div>):(<div style={{marginTop:13,textAlign:"center"}}><button className="btn link" onClick={dismiss}>Got it</button></div>)}
      </div>)}
      {!busy&&!awaiting&&!pending&&canUndo&&<div style={{marginTop:16,textAlign:"center"}}><button className="btn link" onClick={undo}>Undo last applied changes</button></div>}
    </div>

    {state.checkins.length>0&&(<><h2 className="sec">Recent check-ins</h2>{state.checkins.slice(-4).reverse().map((c,i)=>(<div className="blockcard" key={i}><div style={{fontSize:12,color:"var(--faint)",fontWeight:700,marginBottom:8}}>{fmtDay(localKey(new Date(c.date)))}</div><div style={{fontSize:13.5,color:"var(--muted)",lineHeight:1.5,fontWeight:500}}>{c.note}</div></div>))}</>)}
  </div>);
}

function PlanView({state,setState,save,flash}){
  const [goalDraft,setGoalDraft]=useState(state.goals);const [prof,setProf]=useState(state.profile);
  function update(n){setState(n);save(n);}
  function exportData(){try{const blob=new Blob([JSON.stringify(state)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="block-backup-"+localKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);if(flash)flash("Backup downloaded");}catch(e){if(flash)flash("Couldn't export");}}
  function copyData(){copyText(JSON.stringify(state)).then(ok=>{if(flash)flash(ok?"Copied — paste somewhere safe":"Couldn't copy");});}
  function importData(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(!window.confirm("Restore from this backup? It replaces your current data."))return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object")throw 0;update(withDefaults(obj));if(flash)flash("Data restored");}catch{if(flash)flash("Couldn't read that backup file");}};r.readAsText(f);}
  const saveGoal=()=>update({...state,goals:goalDraft});
  const saveProf=()=>update({...state,profile:{weight:Number(prof.weight)||0,goalWeight:Number(prof.goalWeight)||0,kcalTarget:Number(prof.kcalTarget)||0,proteinTarget:Number(prof.proteinTarget)||0}});
  function editEx(wid,exId,field,val){update({...state,workouts:state.workouts.map(w=>w.id!==wid?w:{...w,exercises:(w.exercises||[]).map(e=>e.id!==exId?e:{...e,[field]:(field==="name"||field==="type")?val:Number(val)})})});}
  const removeEx=(wid,exId)=>update({...state,workouts:state.workouts.map(w=>w.id!==wid?w:{...w,exercises:(w.exercises||[]).filter(e=>e.id!==exId)})});
  const addEx=(wid)=>update({...state,workouts:state.workouts.map(w=>w.id!==wid?w:{...w,exercises:[...(w.exercises||[]),{id:uid(),name:"New exercise",type:"free",sets:3,lo:8,hi:12,inc:2}]})});
  const setSched=(d,v)=>update({...state,schedule:{...state.schedule,[d]:v}});
  const opts=[...state.workouts.map(w=>({v:w.id,l:`${w.name}`})),{v:"run",l:"Run"},{v:"football",l:"Football"},{v:"off",l:"Rest"}];
  const profChanged=JSON.stringify({weight:Number(prof.weight),goalWeight:Number(prof.goalWeight),kcalTarget:Number(prof.kcalTarget),proteinTarget:Number(prof.proteinTarget)})!==JSON.stringify(state.profile);
  return (<div>
    <h2 className="sec">Profile & targets</h2>
    <div className="blockcard"><div className="prof">
      <div><label>Weight (kg)</label><input inputMode="decimal" value={prof.weight} onChange={e=>setProf({...prof,weight:e.target.value})}/></div>
      <div><label>Goal (kg)</label><input inputMode="decimal" value={prof.goalWeight} onChange={e=>setProf({...prof,goalWeight:e.target.value})}/></div>
      <div><label>Daily kcal</label><input inputMode="numeric" value={prof.kcalTarget} onChange={e=>setProf({...prof,kcalTarget:e.target.value})}/></div>
      <div><label>Daily protein (g)</label><input inputMode="numeric" value={prof.proteinTarget} onChange={e=>setProf({...prof,proteinTarget:e.target.value})}/></div>
    </div><div style={{marginTop:13}}><button className="btn sm" onClick={saveProf} disabled={!profChanged}>Save profile</button></div></div>

    <h2 className="sec">Your goals</h2>
    <div className="goalbox"><textarea value={goalDraft} onChange={e=>setGoalDraft(e.target.value)}/><div style={{marginTop:10}}><button className="btn sm" onClick={saveGoal} disabled={goalDraft===state.goals}>Save goals</button></div></div>

    <h2 className="sec">Default week</h2>
    <div className="blockcard"><div style={{fontSize:12.5,color:"var(--muted)",marginBottom:12,fontWeight:500}}>Your usual week. The calendar starts from this each week — swap individual days there for one-off changes.</div>
      {DOW.map(d=>(<div className="sched" key={d} style={{display:"grid",gridTemplateColumns:"48px 1fr",gap:10,alignItems:"center",marginBottom:8}}><span style={{fontSize:12,fontWeight:700,color:"var(--muted)"}}>{d.toUpperCase()}</span>
        <select value={state.schedule[d]} onChange={e=>setSched(d,e.target.value)} style={{background:"var(--surface)",border:"1px solid var(--line)",borderRadius:11,padding:12,width:"100%",boxShadow:"var(--shadow)"}}>{opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>))}
    </div>
    {state.workouts.map(w=>(<div className="blockcard" key={w.id}><h3>{w.name}</h3>
      {(w.exercises||[]).map(e=>(<div className="edit-ex" key={e.id}><input value={e.name} onChange={ev=>editEx(w.id,e.id,"name",ev.target.value)}/><input inputMode="numeric" value={e.sets} onChange={ev=>editEx(w.id,e.id,"sets",ev.target.value)}/><select value={e.type} onChange={ev=>editEx(w.id,e.id,"type",ev.target.value)}><option value="free">free</option><option value="machine">machine</option><option value="bw">bodywt</option><option value="hold">hold</option></select><button className="x" onClick={()=>removeEx(w.id,e.id)}>×</button></div>))}
      <button className="btn sm ghost" onClick={()=>addEx(w.id)}>+ add exercise</button></div>))}
    <h2 className="sec">Your data</h2>
    <div className="blockcard">
      <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.55,fontWeight:500,marginBottom:12}}>Your data saves to the cloud on every change. For total peace of mind, download a backup now and then — if anything ever goes wrong, you can restore it here.</div>
      <div className="save-row">
        <button className="btn sm" onClick={exportData}>Download backup</button>
        <button className="btn sm ghost" onClick={copyData}>Copy</button>
        <label className="btn sm ghost" style={{cursor:"pointer",display:"inline-block"}}>Restore<input type="file" accept="application/json,.json" onChange={importData} style={{display:"none"}}/></label>
      </div>
    </div>
    <div style={{height:16}}/>
  </div>);
}

/* ---- New-user onboarding: intake → AI builds a plan anchored to the house design → approve ---- */
function sanitizePlan(p){
  const used=new Set();
  const workouts=(p.workouts||[]).map((w,i)=>{
    let id=((w&&w.id)||("S"+(i+1))).toString();
    while(used.has(id)) id=id+"x";
    used.add(id);
    return {id,name:(w&&w.name)||("Session "+(i+1)),warmup:(w&&w.warmup)||"",finisher:(w&&w.finisher)||"",
      exercises:((w&&w.exercises)||[]).map(e=>({id:uid(),name:(e&&e.name)||"Exercise",
        type:["free","machine","bw","hold"].includes(e&&e.type)?e.type:"free",
        sets:Number(e&&e.sets)||3,lo:Number(e&&e.lo)||8,hi:Number(e&&e.hi)||12,
        inc:(e&&e.inc!=null)?Number(e.inc):2,cue:(e&&e.cue)||""}))};
  });
  const ids=new Set(workouts.map(w=>w.id));
  const sched={};DOW.forEach(d=>{const v=p.schedule&&p.schedule[d];sched[d]=(v==="run"||v==="football"||v==="off"||ids.has(v))?v:"off";});
  return {workouts,schedule:sched};
}

function Onboarding({onDone}){
  const [f,setF]=useState({weight:"",goalWeight:"",estimate:true,kcal:"",protein:"",goal:"",routine:"",days:[],commitments:"",length:"45",equipment:"Both",experience:"Intermediate",injuries:""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const toggleDay=(d)=>setF(p=>({...p,days:p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d]}));
  const [phase,setPhase]=useState("form");
  const [preview,setPreview]=useState(null);
  const [errMsg,setErrMsg]=useState("");
  const canGenerate=f.weight&&f.goal&&f.days.length>0;

  async function generate(){
    setPhase("loading");setErrMsg("");
    const intake={weightKg:Number(f.weight)||null,goalWeightKg:f.goalWeight?Number(f.goalWeight):null,
      estimateCaloriesForMe:!!f.estimate,dailyKcalTarget:(!f.estimate&&f.kcal)?Number(f.kcal):null,dailyProteinTarget:(!f.estimate&&f.protein)?Number(f.protein):null,
      mainGoal:f.goal,currentRoutine:f.routine,trainingDays:f.days,fixedCommitments:f.commitments,
      preferredSessionLengthMin:Number(f.length)||45,equipment:f.equipment,experience:f.experience,injuriesOrLimitations:f.injuries};
    try{
      const r=await api("buildplan",{method:"POST",body:JSON.stringify({intake:JSON.stringify(intake)})});
      if(r.error){setErrMsg(r.error);setPhase("form");return;}
      const clean=sanitizePlan(r);const rp=r.profile||{};
      setPreview({message:r.message||"Here's your starting plan.",goals:r.goals||f.goal,
        profile:{weight:Number(rp.weight)||Number(f.weight)||0,goalWeight:Number(rp.goalWeight)||Number(f.goalWeight)||Number(f.weight)||0,
          kcalTarget:Number(rp.kcalTarget)||Number(f.kcal)||2200,proteinTarget:Number(rp.proteinTarget)||Number(f.protein)||150},
        workouts:clean.workouts,schedule:clean.schedule});
      setPhase("preview");
    }catch(e){setErrMsg(e.code===401?"Your code stopped working — reload and enter it again.":"Couldn't reach the plan builder — tap Build again.");setPhase("form");}
  }

  function approve(){
    onDone(withDefaults({version:6,startDate:todayISO(),onboarded:true,profile:preview.profile,goals:preview.goals,workouts:preview.workouts,schedule:preview.schedule}));
  }

  if(phase==="loading") return (<div className="wrap" style={{paddingTop:64,textAlign:"center",color:"var(--muted)"}}><div style={{fontFamily:"Fraunces",fontWeight:600,fontSize:34,color:"var(--pine)",marginBottom:16,letterSpacing:"-.02em"}}>Block</div><p style={{fontWeight:500,lineHeight:1.5}}>Building your plan around your answers…<br/>this takes a few seconds.</p></div>);

  if(phase==="preview"&&preview){
    const nameFor=(v)=>v==="run"?"Run":v==="football"?"Football":v==="off"?"Rest":((preview.workouts.find(w=>w.id===v)||{}).name||"Rest");
    const repLabel=(e)=>e.type==="hold"?(e.sets+"×"+e.lo+"–"+e.hi+"s"):(e.sets+"×"+e.lo+"–"+e.hi);
    return (<div className="wrap" style={{paddingTop:28,paddingBottom:44}}>
      <h2 className="sec" style={{marginTop:0}}>Your plan</h2>
      <div className="blockcard" style={{lineHeight:1.55,fontWeight:500}}>{preview.message}</div>
      <div className="blockcard">
        <div style={{fontSize:12.5,fontWeight:700,color:"var(--faint)",textTransform:"uppercase"}}>Goal</div>
        <div style={{color:"var(--ink)",fontSize:14.5,margin:"5px 0 13px",fontWeight:500,lineHeight:1.5}}>{preview.goals}</div>
        <div style={{fontSize:12.5,fontWeight:700,color:"var(--faint)",textTransform:"uppercase"}}>Targets</div>
        <div style={{color:"var(--ink)",fontSize:14.5,marginTop:5,fontWeight:500}}>{preview.profile.weight}kg → {preview.profile.goalWeight}kg · {preview.profile.kcalTarget} kcal · {preview.profile.proteinTarget}g protein</div>
      </div>
      <div className="blockcard">
        <div style={{fontSize:12.5,fontWeight:700,color:"var(--faint)",textTransform:"uppercase",marginBottom:9}}>Your week</div>
        {DOW.map(d=>(<div key={d} style={{display:"flex",justifyContent:"space-between",fontSize:13.5,padding:"4px 0",fontWeight:500}}><span style={{fontWeight:700,color:"var(--muted)"}}>{d}</span><span style={{color:"var(--ink)"}}>{nameFor(preview.schedule[d])}</span></div>))}
      </div>
      {preview.workouts.map(w=>(<div className="blockcard" key={w.id}>
        <h3 style={{margin:"0 0 6px",fontSize:15.5}}>{w.name}</h3>
        {w.warmup?<div style={{fontSize:12,color:"var(--faint)",marginBottom:8,fontWeight:500,lineHeight:1.45}}>Warm-up · {w.warmup}</div>:null}
        {w.exercises.map(e=>(<div key={e.id} style={{display:"flex",justifyContent:"space-between",fontSize:13.5,padding:"5px 0",borderTop:"1px solid var(--line)"}}><span>{e.name}</span><span style={{color:"var(--muted)",fontWeight:600,whiteSpace:"nowrap",marginLeft:12}}>{repLabel(e)}</span></div>))}
        {w.finisher?<div style={{fontSize:12,color:"var(--faint)",marginTop:8,fontWeight:500,lineHeight:1.45}}>Finisher · {w.finisher}</div>:null}
      </div>))}
      <div style={{fontSize:12.5,color:"var(--muted)",margin:"2px 2px 16px",fontWeight:500,lineHeight:1.5}}>Fine-tune anything in the Plan tab afterwards — your coach tunes it every couple of weeks.</div>
      <button className="btn" onClick={approve}>Looks good — start training</button>
      <div style={{display:"flex",gap:10,marginTop:10}}>
        <button className="btn ghost" onClick={generate}>Regenerate</button>
        <button className="btn ghost" onClick={()=>setPhase("form")}>Edit answers</button>
      </div>
    </div>);
  }

  const chip=(active)=>({padding:"10px 0",borderRadius:11,border:"1px solid var(--line)",background:active?"var(--pine)":"var(--surface)",color:active?"#fff":"var(--ink)",fontWeight:700,fontSize:13,boxShadow:"var(--shadow)",flex:1});
  const inp={width:"100%",background:"var(--surface2)",border:"1px solid var(--line)",borderRadius:10,padding:11};
  const sel={width:"100%",background:"var(--surface)",border:"1px solid var(--line)",borderRadius:11,padding:12,boxShadow:"var(--shadow)"};
  const lbl={fontSize:11,fontWeight:700,color:"var(--faint)",textTransform:"uppercase",display:"block",marginBottom:6};
  return (<div className="wrap" style={{paddingTop:28,paddingBottom:44}}>
    <div style={{fontFamily:"Fraunces",fontWeight:600,fontSize:32,color:"var(--pine)",letterSpacing:"-.02em"}}>Welcome to Block</div>
    <p style={{color:"var(--muted)",fontSize:14,margin:"5px 0 0",fontWeight:500,lineHeight:1.5}}>Answer a few questions and your plan gets built around you. You can change anything later.</p>

    <h2 className="sec">You</h2>
    <div className="blockcard">
      <div className="prof">
        <div><label style={lbl}>Weight (kg)</label><input style={inp} inputMode="decimal" value={f.weight} onChange={e=>set("weight",e.target.value)}/></div>
        <div><label style={lbl}>Goal weight (kg)</label><input style={inp} inputMode="decimal" placeholder="blank = maintain" value={f.goalWeight} onChange={e=>set("goalWeight",e.target.value)}/></div>
      </div>
      <label style={{display:"flex",alignItems:"center",gap:9,marginTop:14,fontSize:14,fontWeight:500}}><input type="checkbox" checked={f.estimate} onChange={e=>set("estimate",e.target.checked)} style={{width:18,height:18}}/>Estimate my calories and protein for me</label>
      {!f.estimate?(<div className="prof" style={{marginTop:12}}>
        <div><label style={lbl}>Daily kcal</label><input style={inp} inputMode="numeric" value={f.kcal} onChange={e=>set("kcal",e.target.value)}/></div>
        <div><label style={lbl}>Daily protein (g)</label><input style={inp} inputMode="numeric" value={f.protein} onChange={e=>set("protein",e.target.value)}/></div>
      </div>):null}
    </div>

    <h2 className="sec">Your goal</h2>
    <div className="goalbox"><textarea placeholder="What do you want to achieve? e.g. get stronger, lean down, touch my toes, build muscle for football…" value={f.goal} onChange={e=>set("goal",e.target.value)}/></div>

    <h2 className="sec">How you train now</h2>
    <div className="goalbox"><textarea placeholder="Your current routine or split, if any. e.g. push/pull/legs 3x a week — or 'nothing structured yet'." value={f.routine} onChange={e=>set("routine",e.target.value)}/></div>

    <h2 className="sec">Your week</h2>
    <div className="blockcard">
      <label style={lbl}>Which days do you usually train?</label>
      <div style={{display:"flex",gap:6,marginBottom:15}}>{DOW.map(d=>(<button key={d} onClick={()=>toggleDay(d)} style={chip(f.days.includes(d))}>{d[0]}</button>))}</div>
      <label style={lbl}>Any fixed commitments?</label>
      <input style={inp} placeholder="e.g. football Tue & Sun, run Sat" value={f.commitments} onChange={e=>set("commitments",e.target.value)}/>
      <label style={{...lbl,marginTop:15}}>Preferred workout length</label>
      <select style={sel} value={f.length} onChange={e=>set("length",e.target.value)}><option value="30">Around 30 min</option><option value="45">Around 45 min</option><option value="60">Around 60 min</option></select>
    </div>

    <h2 className="sec">Setup</h2>
    <div className="blockcard">
      <label style={lbl}>Equipment</label>
      <select style={sel} value={f.equipment} onChange={e=>set("equipment",e.target.value)}><option>Full gym</option><option>Home only</option><option>Both</option></select>
      <label style={{...lbl,marginTop:15}}>Experience</label>
      <select style={sel} value={f.experience} onChange={e=>set("experience",e.target.value)}><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
      <label style={{...lbl,marginTop:15}}>Injuries or limitations (optional)</label>
      <input style={inp} placeholder="e.g. dodgy left knee, tight lower back" value={f.injuries} onChange={e=>set("injuries",e.target.value)}/>
    </div>

    {errMsg?<div style={{margin:"8px 2px 12px",color:"#b4432f",fontWeight:600,fontSize:13.5}}>{errMsg}</div>:null}
    <button className="btn" onClick={generate} disabled={!canGenerate} style={!canGenerate?{opacity:.55}:null}>Build my plan</button>
    {!canGenerate?<div style={{fontSize:12.5,color:"var(--faint)",marginTop:9,textAlign:"center",fontWeight:500}}>Add your weight, your goal, and at least one training day.</div>:null}
    <div style={{height:14}}/>
  </div>);
}

function App(){
  const [authed,setAuthed]=useState(false);const [pwInput,setPwInput]=useState("");const [err,setErr]=useState("");const [needsOnboarding,setNeedsOnboarding]=useState(false);
  const [state,setStateRaw]=useState(null);const [tab,setTab]=useState("train");const [toast,setToast]=useState("");const tRef=useRef();
  const [saveStatus,setSaveStatus]=useState("saved");const unsavedRef=useRef(null);
  const setState=(u)=>setStateRaw(u);
  const flash=(m)=>{setToast(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToast(""),1400);};
  async function load(){try{const r=await api("state");if(r.state==null){setNeedsOnboarding(true);setAuthed(true);}else{setStateRaw(withDefaults(r.state));setNeedsOnboarding(false);setAuthed(true);}}catch(e){if(e.code===401){setAuthed(false);setErr("Wrong code.");}else setErr("Couldn't connect.");}}
  useEffect(()=>{if(getPw())load();},[]);
  async function unlock(){setErr("");setPw(pwInput);try{const r=await api("state");if(r.state==null){setNeedsOnboarding(true);setAuthed(true);}else{setStateRaw(withDefaults(r.state));setNeedsOnboarding(false);setAuthed(true);}}catch(e){setErr(e.code===401?"Wrong code.":"Couldn't connect.");setPw("");}}
  async function save(next){setSaveStatus("saving");unsavedRef.current=next;try{await api("state",{method:"POST",body:JSON.stringify({state:next})});setSaveStatus("saved");unsavedRef.current=null;}catch{setSaveStatus("failed");}}
  function retrySave(){if(unsavedRef.current)save(unsavedRef.current);}
  if(!authed) return (<div className="lock"><div className="mark serif">Block</div><p>Your training. Enter your code.</p><input type="password" placeholder="your code" value={pwInput} onChange={e=>setPwInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&unlock()} autoFocus/><div className="err">{err}</div><button className="btn" onClick={unlock}>Unlock</button></div>);
  if(needsOnboarding) return <Onboarding onDone={b=>{setStateRaw(b);save(b);setNeedsOnboarding(false);}}/>;
  if(!state) return <div className="wrap" style={{paddingTop:48,color:"var(--muted)"}}>Loading…</div>;
  const hour=new Date().getHours();const greet=hour<12?"Good morning":hour<18?"Good afternoon":"Good evening";
  const planNow=state.weekPlans[weekStartKey(localKey())]||state.schedule;
  const todayVal=planNow[DOW[(new Date().getDay()+6)%7]]||"off";
  const todayName=sessionName(state,todayVal);
  const checkinDue=daysBetween(state.lastCheckin)>=14;
  return (<div className="wrap">
    <header><div className="hello serif">{greet}</div><div className="sub">Today · <b>{todayName}</b> <span className={"savedot "+saveStatus}>· {saveStatus==="saving"?"saving…":saveStatus==="failed"?"not saved":"saved"}</span></div>
      {saveStatus==="failed"&&<div className="savefail" onClick={retrySave}>⚠ Your last change didn't save — tap to retry</div>}
      {checkinDue&&tab!=="checkin"&&(<div className="banner"><div className="txt">It's been a fortnight — log your numbers and let your coach tune the next block.</div><button onClick={()=>setTab("checkin")}>Check in</button></div>)}
    </header>
    {tab==="train"&&<TrainView state={state} setState={setState} save={save} flash={flash}/>}
    {tab==="progress"&&<ProgressView state={state} setState={setState} save={save} flash={flash}/>}
    {tab==="food"&&<FoodView state={state} setState={setState} save={save}/>}
    {tab==="checkin"&&<CheckinView state={state} setState={setState} save={save} flash={flash}/>}
    {tab==="plan"&&<PlanView state={state} setState={setState} save={save} flash={flash}/>}
    <Toast msg={toast}/>
    <nav>
      <button className={tab==="train"?"on":""} onClick={()=>setTab("train")}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Calendar</button>
      <button className={tab==="progress"?"on":""} onClick={()=>setTab("progress")}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19V5M4 19h16M8 16v-5M13 16V8M18 16v-3"/></svg>Progress</button>
      <button className={tab==="food"?"on":""} onClick={()=>setTab("food")}>{state.foodPending&&<span className="dot"/>}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3v7M10 3v7M8 10v11M6 3a2 2 0 0 0 4 0M17 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v9"/></svg>Food</button>
      <button className={tab==="checkin"?"on":""} onClick={()=>setTab("checkin")}>{(checkinDue||state.pending)&&<span className="dot"/>}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Coach</button>
      <button className={tab==="plan"?"on":""} onClick={()=>setTab("plan")}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan</button>
    </nav>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
